name: Build Priority Matrix APK from ZIP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract uploaded Android source ZIP
        run: |
          unzip -q PriorityMatrix-Cloud-Build-Source.zip -d source
          test -d source/pm_buildkit/app

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: source/pm_buildkit
        run: gradle --no-daemon :app:assembleDebug

      - name: Package APK
        run: |
          mkdir -p release
          cp source/pm_buildkit/app/build/outputs/apk/debug/app-debug.apk release/PriorityMatrix.apk
          cd release
          zip -9 PriorityMatrix-APK.zip PriorityMatrix.apk
          sha256sum PriorityMatrix.apk > SHA256SUMS.txt

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: PriorityMatrix-Android-APK
          path: |
            release/PriorityMatrix-APK.zip
            release/PriorityMatrix.apk
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
